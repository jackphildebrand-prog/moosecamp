<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moose camp packing list</title>
<style>
  :root { --canvas:#ECE5D3; --canvas-deep:#DFD5BC; --spruce:#1B3325; --moss:#4F6B4A; --tan:#B8A77C; --blaze:#F26A1B; --ink:#1E2418; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--canvas); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:17px; line-height:1.4; }
  button { font:inherit; cursor:pointer; }
  input, select { font:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--blaze); outline-offset:2px; }

  header { background:var(--spruce); color:var(--canvas); padding:20px 18px 16px; }
  header h1 { margin:0; font-size:28px; font-weight:800; letter-spacing:-0.5px; line-height:1.05; }
  header p { margin:6px 0 0; opacity:.8; font-size:15px; }

  .who { padding:14px 18px 4px; }
  .who p { margin:0 0 8px; font-weight:600; }
  .row { display:flex; gap:8px; }
  .row button { flex:1; padding:12px 0; border:2px solid var(--spruce); background:transparent; color:var(--spruce); border-radius:8px; font-weight:700; font-size:17px; }
  .row button.on { background:var(--blaze); border-color:var(--blaze); color:#fff; }

  .tabs { display:flex; gap:8px; padding:12px 18px 0; }
  .tabs button { flex:1; padding:10px 0; border-radius:8px; border:2px solid var(--moss); background:transparent; color:var(--moss); font-weight:700; font-size:15px; }
  .tabs button.on { background:var(--moss); color:#fff; }
  .status { text-align:center; font-size:13px; color:var(--moss); padding:8px 6px 2px; min-height:24px; }

  .add { background:var(--spruce); padding:12px; margin:8px 0 0; }
  .add .row + .row { margin-top:6px; }
  .add input, .add select { flex:1; padding:11px; border-radius:8px; border:0; background:#fff; color:var(--ink); min-width:0; }
  .add button { flex:none; padding:11px 16px; border-radius:8px; border:0; background:var(--blaze); color:#fff; font-weight:800; }

  main { padding:6px 12px 40px; }
  .cat { margin:14px 4px 6px; }
  .cat button { width:100%; text-align:left; background:none; border:0; border-bottom:2px solid var(--tan); padding:6px 2px; font-size:18px; font-weight:800; color:var(--spruce); display:flex; justify-content:space-between; align-items:baseline; }
  .cat button span { font-weight:400; color:var(--moss); font-size:14px; white-space:nowrap; }
  .cat { display:flex; align-items:stretch; }
  .cat button:first-child { flex:1; }
  .catmenu { flex:none; width:44px; border:0 !important; border-bottom:2px solid var(--tan) !important; background:none; color:var(--moss); font-size:22px; font-weight:800; }
  .cat.closed + .items { display:none; }

  .item { background:#F6F1E4; border:1px solid var(--canvas-deep); border-left:6px solid var(--canvas-deep); border-radius:10px; margin-bottom:8px; padding:10px 12px; }
  .item.mine { border-left-color:var(--blaze); }
  .item.none { border-left-color:#c9782f; }
  .item.all { border-left-color:var(--moss); }
  .top { display:flex; align-items:center; gap:8px; }
  .name { font-weight:700; font-size:18px; flex:1; text-align:left; background:none; border:0; padding:2px 0; color:var(--ink); }
  .name:after { content:" ▸"; color:var(--tan); font-size:14px; }
  .item.open .name:after { content:" ▾"; }
  .badge { font-size:13px; font-weight:700; color:#fff; background:var(--moss); border-radius:999px; padding:3px 10px; white-space:nowrap; }
  .claims { display:flex; gap:6px; margin-top:8px; align-items:center; }
  .claims button { padding:7px 11px; border-radius:999px; border:2px solid var(--moss); background:transparent; color:var(--moss); font-weight:600; font-size:15px; }
  .claims button.on { background:var(--moss); color:#fff; }
  .claims button.on.me { background:var(--blaze); border-color:var(--blaze); }
  .nobody { font-size:14px; color:#8a4a1f; margin-top:6px; font-weight:600; }
  .notes { margin-top:10px; background:#FFF6E8; border:1px solid #F0C9A3; border-left:5px solid var(--blaze); border-radius:8px; padding:8px 12px; }
  .note { font-size:18px; line-height:1.35; margin:4px 0; }
  .note b { color:var(--blaze); }
  .more { display:none; margin-top:10px; padding-top:8px; border-top:1px dashed var(--tan); }
  .item.open .more { display:flex; gap:16px; flex-wrap:wrap; }
  .more button { background:none; border:0; color:var(--moss); text-decoration:underline; padding:4px 0; font-size:15px; }
  .more button.danger { color:#9a2f12; }

  .pack { display:flex; align-items:center; gap:12px; background:#F6F1E4; border:1px solid var(--canvas-deep); border-radius:10px; margin-bottom:8px; padding:12px; font-size:18px; font-weight:600; cursor:pointer; }
  .pack input { width:26px; height:26px; accent-color:var(--blaze); flex:none; }
  .pack .tick { width:26px; text-align:center; flex:none; color:var(--moss); font-weight:800; }
  .pack.done { color:#8b8670; text-decoration:line-through; background:#EFE9DA; }
  .pack small { display:block; font-size:16px; font-weight:500; color:#8a4a1f; text-decoration:none; margin-top:2px; }
  .pack .tag { font-size:12px; font-weight:700; color:var(--moss); text-decoration:none; margin-left:auto; white-space:nowrap; }
  .locked main, .locked .add, .locked .tabs { opacity:.35; pointer-events:none; }
</style>
</head>
<body class="locked">
<header>
  <h1>Moose camp packing list</h1>
  <p>North of Thompson. Tap your name on anything you're bringing.</p>
</header>

<div class="who">
  <p>First, who are you?</p>
  <div class="row" id="whoRow"></div>
</div>

<div class="tabs">
  <button id="tabPlan" class="on">The list</button>
  <button id="tabPack">Packing</button>
</div>
<div class="status" id="status">Loading the list…</div>

<div class="add" id="addPlan">
  <div class="row"><input id="newName" placeholder="Add something to the list" aria-label="New item"><button id="addBtn">Add</button></div>
  <div class="row"><select id="newCat" aria-label="Category"></select></div>
  <div class="row"><select id="newKind" aria-label="Who brings it">
    <option value="shared">Somebody brings it (shared gear)</option>
    <option value="all">Everyone brings their own</option>
    <option value="me">Just for my list</option>
  </select></div>
</div>

<main>
  <section id="planView"><div id="planList"></div></section>
  <section id="packView" style="display:none">
    <p style="margin:10px 6px 6px;font-weight:600">Whose list?</p>
    <div class="row" id="packWho"></div>
    <div class="add" id="addPack" style="margin-top:12px;border-radius:10px">
      <div class="row"><input id="newMine" placeholder="Add something just for my list" aria-label="Personal item"><button id="addMineBtn">Add</button></div>
    </div>
    <div class="cat"><button disabled style="justify-content:space-between"><span style="font-size:18px;font-weight:800;color:var(--spruce)" id="packTitle"></span><span id="packProgress"></span></button></div>
    <div id="packList"></div>
  </section>
</main>

<script>
const PEOPLE = ["Jack", "Christian", "Alfred"];
const CATS = ["Boat gear","Bug protection","Camp","Clothing","Cooking","Daypack","Documents & licences","Emergency & communication",
  "Fire","Fishing","Food","Footwear","Fun & comfort","Hygiene","Meat transport","Moose calling","Moose processing",
  "Navigation & electronics","Optics","Other","Personal first aid","Power & lighting","Rifle & hunting gear","Rope & cordage",
  "Sleeping","Tarps & dry bags","Tools & repair","Water"];
const DB_URL = "https://okaqylkpsnsfzdysvucs.supabase.co/rest/v1/packing_items";
const DB_KEY = "sb_publishable_0U_F2B7nJdcJk0DEXTTqzg_sjEzJ2K6";
const H = { "apikey": DB_KEY, "Authorization": "Bearer " + DB_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" };

let me = null, data = { items: [] }, openId = null, view = "plan", packPerson = null;
let closedCats = {};

const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
const catsIn = items => [...new Set(items.map(i => i.category))].sort((a, b) => a.localeCompare(b));
const allCats = () => [...new Set(CATS.concat(data.items.map(i => i.category)))].sort((a, b) => a.localeCompare(b));
function fillCatSelect() {
  const sel = document.getElementById("newCat"); const keep = sel.value;
  sel.innerHTML = allCats().map(c => `<option>${esc(c)}</option>`).join("") + `<option value="__new">+ New category…</option>`;
  if (keep && [...sel.options].some(o => o.value === keep)) sel.value = keep;
}
function pickCategory(current) {
  const list = allCats();
  const msg = "Move to which category? Type the number, or type a new name:\n" + list.map((c, i) => `${i + 1}. ${c}`).join("\n");
  const ans = (prompt(msg, current) || "").trim(); if (!ans) return null;
  const n = parseInt(ans, 10);
  return (n >= 1 && n <= list.length && String(n) === ans) ? list[n - 1] : ans;
}

async function load() {
  const r = await fetch(DB_URL + "?select=*", { headers: H });
  if (!r.ok) throw new Error("load failed");
  data = { items: (await r.json()).sort(byName) };
}
function loadMe() { try { me = localStorage.getItem("moose_me"); } catch (e) { me = null; } }
async function save(method, url, body) {
  const r = await fetch(url, { method, headers: H, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error("save failed");
}
async function change(localFn, remoteFn) {
  localFn(data); render(); setStatus("Saving…");
  try { await remoteFn(); await load(); setStatus("Saved — the other guys will see it"); }
  catch (e) { setStatus("Couldn't save — check your signal and try again"); }
  render();
}
function setStatus(t) { document.getElementById("status").textContent = t; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const rowUrl = id => `${DB_URL}?id=eq.${id}`;

function renderWho() {
  const row = document.getElementById("whoRow");
  row.innerHTML = PEOPLE.map(p => `<button data-p="${p}" class="${p === me ? "on" : ""}">${p}</button>`).join("");
  row.querySelectorAll("button").forEach(b => b.onclick = () => {
    me = b.dataset.p; packPerson = me;
    try { localStorage.setItem("moose_me", me); } catch (e) {}
    setStatus("Up to date"); render();
  });
  document.body.classList.toggle("locked", !me);
}

/* ---------- The list ---------- */
function itemHtml(it) {
  const mine = it.claims.includes(me);
  const cls = it.own ? "all" : (mine ? "mine" : (it.claims.length ? "" : "none"));
  const badge = it.own ? `<span class="badge">Everyone brings</span>` : "";
  const claims = it.own ? "" : `<div class="claims">` + PEOPLE.map(p =>
    `<button data-claim="${p}" class="${it.claims.includes(p) ? "on" : ""} ${p === me ? "me" : ""}">${p}</button>`).join("") + `</div>` +
    (it.claims.length ? "" : `<div class="nobody">Nobody's got this yet</div>`);
  const notes = it.notes.length ? `<div class="notes">` + it.notes.map(n => `<div class="note"><b>${esc(n.who)}:</b> ${esc(n.text)}</div>`).join("") + `</div>` : "";
  return `<div class="item ${cls} ${openId === it.id ? "open" : ""}" data-id="${it.id}">
    <div class="top"><button class="name">${esc(it.name)}</button>${badge}</div>
    ${claims}${notes}
    <div class="more">
      <button data-note>+ Add a note</button>
      <button data-rename>Rename</button>
      <button data-move>Move to…</button>
      <button data-flip>${it.own ? "Make it shared gear" : "Make it everyone-brings"}</button>
      <button data-remove class="danger">Remove</button>
    </div>
  </div>`;
}

function planHtml() {
  const items = data.items.filter(i => !i.personal);
  if (!items.length) return `<div class="item">Nothing here yet — add something above.</div>`;
  return catsIn(items).map(c => {
    const list = items.filter(i => i.category === c);
    const need = list.filter(i => !i.own && !i.claims.length).length;
    const tag = need ? `${need} still need someone` : "all covered";
    return `<div class="cat ${closedCats[c] ? "closed" : ""}"><button data-cat="${esc(c)}">${esc(c)} <span>${tag} ${closedCats[c] ? "▸" : "▾"}</span></button>
      <button class="catmenu" data-catmenu="${esc(c)}" aria-label="Category options">⋯</button></div>
      <div class="items">${list.map(itemHtml).join("")}</div>`;
  }).join("");
}

async function bulk(method, filter, body) { await save(method, `${DB_URL}?${filter}`, body); }

function wirePlan() {
  document.querySelectorAll("[data-catmenu]").forEach(b => b.onclick = () => {
    const c = b.dataset.catmenu;
    const ans = (prompt(`"${c}" — type 1 to rename it, or 2 to delete it and everything in it:`) || "").trim();
    if (ans === "1") {
      const name = (prompt("New name for this category:", c) || "").trim(); if (!name || name === c) return;
      change(d => { d.items.forEach(i => { if (i.category === c) i.category = name; }); },
             () => bulk("PATCH", "category=eq." + encodeURIComponent(c), { category: name }));
    } else if (ans === "2") {
      const n = data.items.filter(i => i.category === c).length;
      if (!confirm(`Delete "${c}" and its ${n} item(s) for everyone?`)) return;
      change(d => { d.items = d.items.filter(i => i.category !== c); },
             () => bulk("DELETE", "category=eq." + encodeURIComponent(c)));
    }
  });
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { closedCats[b.dataset.cat] = !closedCats[b.dataset.cat]; render(); });
  document.querySelectorAll(".item[data-id]").forEach(el => {
    const id = el.dataset.id;
    const cur = () => data.items.find(i => i.id === id);
    el.querySelector(".name").onclick = () => { openId = openId === id ? null : id; render(); };
    el.querySelectorAll("[data-claim]").forEach(b => b.onclick = () => {
      const it = cur(); if (!it) return; const p = b.dataset.claim;
      const claims = it.claims.includes(p) ? it.claims.filter(x => x !== p) : it.claims.concat(p);
      change(d => { it.claims = claims; }, () => save("PATCH", rowUrl(id), { claims }));
    });
    el.querySelector("[data-note]").onclick = () => {
      const text = (prompt("Add a note about " + cur().name + ":") || "").trim(); if (!text) return;
      const it = cur(); const notes = it.notes.concat({ who: me, text });
      change(d => { it.notes = notes; }, () => save("PATCH", rowUrl(id), { notes }));
    };
    el.querySelector("[data-rename]").onclick = () => {
      const it = cur(); const name = (prompt("Rename this item:", it.name) || "").trim(); if (!name || name === it.name) return;
      change(d => { it.name = name; d.items.sort(byName); }, () => save("PATCH", rowUrl(id), { name }));
    };
    el.querySelector("[data-move]").onclick = () => {
      const it = cur(); const category = pickCategory(it.category); if (!category || category === it.category) return;
      closedCats[category] = false;
      change(d => { it.category = category; }, () => save("PATCH", rowUrl(id), { category }));
    };
    el.querySelector("[data-flip]").onclick = () => {
      const it = cur(); const own = !it.own;
      change(d => { it.own = own; }, () => save("PATCH", rowUrl(id), { own }));
    };
    el.querySelector("[data-remove]").onclick = () => {
      if (!confirm("Remove this item for everyone?")) return;
      change(d => { d.items = d.items.filter(i => i.id !== id); }, () => save("DELETE", rowUrl(id)));
    };
  });
}

/* ---------- Packing ---------- */
function packHtml(who) {
  const list = data.items.filter(i => i.own || i.claims.includes(who) || i.personal === who);
  const done = list.filter(i => i.packed.includes(who)).length;
  document.getElementById("packTitle").textContent = who === me ? "My list" : who + "'s list";
  document.getElementById("packProgress").textContent = list.length ? `${done} of ${list.length} packed` : "";
  if (!list.length) return `<div class="item">Nothing here yet.</div>`;
  const self = who === me;
  return catsIn(list).map(c => {
    const items = list.filter(i => i.category === c);
    const key = "pack:" + c;
    return `<div class="cat ${closedCats[key] ? "closed" : ""}"><button data-cat="${esc(key)}">${esc(c)} <span>${items.length} ${closedCats[key] ? "▸" : "▾"}</span></button></div>
      <div class="items">` + items.map(it => {
        const isDone = it.packed.includes(who);
        const note = it.notes.filter(n => n.who === who).map(n => esc(n.text)).join(" · ");
        const tag = it.personal ? "just mine" : (it.own ? "everyone brings" : "");
        const box = self ? `<input type="checkbox" data-pack="${it.id}" ${isDone ? "checked" : ""}>` : `<span class="tick">${isDone ? "✓" : "–"}</span>`;
        const extra = it.personal && self ? `<button data-rm-mine="${it.id}" style="background:none;border:0;color:#9a2f12;text-decoration:underline;font-size:13px;margin-left:auto">remove</button>` : (tag ? `<span class="tag">${tag}</span>` : "");
        return `<label class="pack ${isDone ? "done" : ""}">${box}<span>${esc(it.name)}${note ? `<small>${note}</small>` : ""}</span>${extra}</label>`;
      }).join("") + `</div>`;
  }).join("");
}

function wirePack() {
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { closedCats[b.dataset.cat] = !closedCats[b.dataset.cat]; render(); });
  document.querySelectorAll("[data-pack]").forEach(cb => cb.onchange = () => {
    const it = data.items.find(i => i.id === cb.dataset.pack); if (!it) return;
    const packed = cb.checked ? [...new Set(it.packed.concat(me))] : it.packed.filter(x => x !== me);
    change(d => { it.packed = packed; }, () => save("PATCH", rowUrl(it.id), { packed }));
  });
  document.querySelectorAll("[data-rm-mine]").forEach(b => b.onclick = e => {
    e.preventDefault(); const id = b.dataset.rmMine;
    if (!confirm("Take this off your list?")) return;
    change(d => { d.items = d.items.filter(i => i.id !== id); }, () => save("DELETE", rowUrl(id)));
  });
}

function render() {
  renderWho();
  if (document.activeElement !== document.getElementById("newCat")) fillCatSelect();
  document.getElementById("tabPlan").classList.toggle("on", view === "plan");
  document.getElementById("tabPack").classList.toggle("on", view === "pack");
  document.getElementById("planView").style.display = view === "plan" ? "" : "none";
  document.getElementById("addPlan").style.display = view === "plan" ? "" : "none";
  document.getElementById("packView").style.display = view === "pack" ? "" : "none";
  if (view === "plan") { document.getElementById("planList").innerHTML = planHtml(); wirePlan(); }
  else {
    if (!packPerson) packPerson = me;
    const pw = document.getElementById("packWho");
    pw.innerHTML = PEOPLE.map(p => `<button data-pp="${p}" class="${p === packPerson ? "on" : ""}">${p === me ? "Me" : p}</button>`).join("");
    pw.querySelectorAll("button").forEach(b => b.onclick = () => { packPerson = b.dataset.pp; render(); });
    document.getElementById("addPack").style.display = packPerson === me ? "" : "none";
    document.getElementById("packList").innerHTML = packHtml(packPerson); wirePack();
  }
}

document.getElementById("tabPlan").onclick = () => { view = "plan"; render(); };
document.getElementById("tabPack").onclick = () => { view = "pack"; render(); };
fillCatSelect();
document.getElementById("newCat").onchange = e => {
  if (e.target.value !== "__new") return;
  const name = (prompt("Name of the new category:") || "").trim();
  if (name) { const o = document.createElement("option"); o.textContent = name; e.target.insertBefore(o, e.target.lastElementChild); e.target.value = name; }
  else e.target.value = allCats()[0];
};

function addItem(name, category, kind) {
  const body = { name, category, own: kind === "all", personal: kind === "me" ? me : null, claims: kind === "me" ? [me] : [] };
  closedCats[category] = false; closedCats["pack:" + category] = false;
  change(d => { d.items.push({ id: "tmp" + Date.now(), notes: [], packed: [], ...body }); d.items.sort(byName); },
         () => save("POST", DB_URL, body));
}
document.getElementById("addBtn").onclick = () => {
  const inp = document.getElementById("newName"); const name = inp.value.trim(); if (!name) return;
  inp.value = "";
  addItem(name, document.getElementById("newCat").value, document.getElementById("newKind").value);
};
document.getElementById("newName").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("addBtn").click(); });
document.getElementById("addMineBtn").onclick = () => {
  const inp = document.getElementById("newMine"); const name = inp.value.trim(); if (!name) return;
  inp.value = ""; addItem(name, "Other", "me");
};
document.getElementById("newMine").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("addMineBtn").click(); });

(async function start() {
  loadMe(); packPerson = me;
  try { await load(); setStatus(me ? "Up to date" : "Pick your name to start"); }
  catch (e) { setStatus("Couldn't reach the list — check your signal and reload"); }
  render();
  setInterval(async () => {
    const typing = document.activeElement && ["INPUT","SELECT"].includes(document.activeElement.tagName);
    if (!openId && !typing) { try { await load(); render(); } catch (e) {} }
  }, 8000);
})();
</script>
</body>
</html>
