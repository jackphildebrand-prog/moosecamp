<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moose camp packing list</title>
<style>
  :root {
    --canvas: #ECE5D3;
    --canvas-deep: #DFD5BC;
    --spruce: #1B3325;
    --moss: #4F6B4A;
    --tan: #B8A77C;
    --blaze: #F26A1B;
    --ink: #1E2418;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--canvas); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 17px; line-height: 1.4; }
  button { font: inherit; cursor: pointer; }
  input, textarea { font: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--blaze); outline-offset: 2px; }

  header { background: var(--spruce); color: var(--canvas); padding: 22px 18px 18px; }
  header h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.05; }
  header p { margin: 6px 0 0; opacity: .8; font-size: 15px; }

  .who { padding: 14px 18px 4px; }
  .who p { margin: 0 0 8px; font-weight: 600; }
  .who-row { display: flex; gap: 8px; }
  .who-row button { flex: 1; padding: 12px 0; border: 2px solid var(--spruce); background: transparent; color: var(--spruce); border-radius: 8px; font-weight: 700; font-size: 17px; }
  .who-row button.on { background: var(--blaze); border-color: var(--blaze); color: #fff; }

  main { padding: 8px 12px 40px; }
  section h2 { font-size: 20px; font-weight: 800; margin: 22px 6px 8px; color: var(--spruce); }
  section h2 small { display: block; font-size: 14px; font-weight: 400; color: var(--moss); margin-top: 2px; }

  .cat { margin: 14px 4px 6px; }
  .cat button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 2px solid var(--tan); padding: 6px 2px; font-size: 17px; font-weight: 700; color: var(--spruce); display: flex; justify-content: space-between; }
  .cat button span { font-weight: 400; color: var(--moss); font-size: 14px; }
  .cat.closed + .items { display: none; }
  .item { background: #F6F1E4; border: 1px solid var(--canvas-deep); border-radius: 10px; margin-bottom: 8px; padding: 10px 12px; }
  .item.mine { border-left: 6px solid var(--blaze); }
  .item.none { border-left: 6px solid var(--tan); }
  .item-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .name { font-weight: 700; font-size: 18px; flex: 1; text-align: left; background: none; border: 0; padding: 4px 0; color: var(--ink); }
  .name:after { content: " ▸"; color: var(--tan); font-size: 14px; }
  .item.open .name:after { content: " ▾"; }
  .claims { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .claims button { padding: 8px 12px; border-radius: 999px; border: 2px solid var(--moss); background: transparent; color: var(--moss); font-weight: 600; font-size: 15px; }
  .claims button.on { background: var(--moss); color: #fff; }
  .claims button.on.me { background: var(--blaze); border-color: var(--blaze); }
  .nobody { font-size: 14px; color: #8a4a1f; margin-top: 8px; font-weight: 600; }
  .notes { margin-top: 8px; padding-left: 6px; border-left: 2px solid var(--canvas-deep); }
  .note { font-size: 15px; margin: 4px 0; }
  .note b { color: var(--moss); }
  .more { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--tan); }
  .item.open .more { display: block; }
  .note-row { display: flex; gap: 6px; }
  .note-row input { flex: 1; padding: 10px; border: 1px solid var(--tan); border-radius: 8px; background: #fff; }
  .note-row button { padding: 10px 14px; border-radius: 8px; border: 0; background: var(--spruce); color: #fff; font-weight: 700; }
  .small-actions { display: flex; gap: 14px; margin-top: 10px; }
  .small-actions button { background: none; border: 0; color: var(--moss); text-decoration: underline; padding: 4px 0; font-size: 15px; }
  .small-actions button.danger { color: #9a2f12; }

  .add { background: var(--spruce); padding: 12px 12px 14px; margin: 8px 0 0; }
  .add-row { display: flex; gap: 6px; }
  .add-row input, .add-row select { flex: 1; padding: 12px; border-radius: 8px; border: 0; background: #fff; color: var(--ink); }
  .add-row button { padding: 12px 16px; border-radius: 8px; border: 0; background: var(--blaze); color: #fff; font-weight: 800; }
  .add label { display: flex; align-items: center; gap: 8px; color: var(--canvas); font-size: 15px; margin-top: 8px; }
  .add input[type=checkbox] { width: 20px; height: 20px; }

  .status { text-align: center; font-size: 13px; color: var(--moss); padding: 6px; }
  .locked main, .locked .add { opacity: .35; pointer-events: none; }
  @media (prefers-reduced-motion: no-preference) {
    .claims button { transition: background .15s, color .15s; }
  }
</style>
</head>
<body class="locked">
<header>
  <h1>Moose camp packing list</h1>
  <p>North of Thompson. Tap your name on anything you're bringing.</p>
</header>

<div class="who">
  <p>First, who are you?</p>
  <div class="who-row" id="whoRow"></div>
</div>

<div class="add">
  <div class="add-row">
    <input id="newName" placeholder="Add something to the list" aria-label="New item">
    <button id="addBtn">Add</button>
  </div>
  <div class="add-row" style="margin-top:6px"><select id="newCat" aria-label="Category"></select></div>
  <label><input type="checkbox" id="newOwn"> Everybody brings their own</label>
</div>

<div class="status" id="status">Loading the list…</div>

<main>
  <section>
    <h2>Shared gear <small>Somebody needs to bring these. Some need two people.</small></h2>
    <div id="sharedList"></div>
  </section>
  <section>
    <h2>Everybody brings their own <small>No need to claim — just don't forget it.</small></h2>
    <div id="ownList"></div>
  </section>
</main>


<script>
const PEOPLE = ["Jack", "Christian", "Alfred"];
const CATS = ["Camp","Cooking","Food","Water","Boat gear","Moose calling","Moose processing","Meat transport","Rope & cordage",
  "Tarps & dry bags","Tools & repair","Power & lighting","Fire","Emergency & communication","Bug protection","Fun & comfort",
  "Documents & licences","Clothing","Footwear","Rifle & hunting gear","Optics","Daypack","Navigation & electronics",
  "Personal first aid","Sleeping","Hygiene","Fishing","Other"];
let closedCats = {};
const DB_URL = "https://okaqylkpsnsfzdysvucs.supabase.co/rest/v1/packing_items";
const DB_KEY = "sb_publishable_0U_F2B7nJdcJk0DEXTTqzg_sjEzJ2K6";
const H = { "apikey": DB_KEY, "Authorization": "Bearer " + DB_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" };

let me = null;
let data = { items: [] };
let openId = null;

async function load() {
  const r = await fetch(DB_URL + "?select=*&order=created_at.asc", { headers: H });
  if (!r.ok) throw new Error("load failed");
  data = { items: await r.json() };
}

function loadMe() { try { me = localStorage.getItem("moose_me"); } catch (e) { me = null; } }

async function save(method, url, body) {
  const r = await fetch(url, { method, headers: H, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error("save failed");
}

// Show the change right away, send it to the database, then re-read so everyone matches.
async function change(localFn, remoteFn) {
  localFn(data);
  render();
  setStatus("Saving…");
  try {
    await remoteFn();
    await load();
    setStatus("Saved — the other guys will see it");
  } catch (e) {
    setStatus("Couldn't save — check your signal and try again");
  }
  render();
}

function setStatus(t) { document.getElementById("status").textContent = t; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function renderWho() {
  const row = document.getElementById("whoRow");
  row.innerHTML = PEOPLE.map(p => `<button data-p="${p}" class="${p === me ? "on" : ""}">${p}</button>`).join("");
  row.querySelectorAll("button").forEach(b => b.onclick = () => {
    me = b.dataset.p;
    try { localStorage.setItem("moose_me", me); } catch (e) {}
    document.body.classList.remove("locked");
    setStatus("Up to date");
    render();
  });
  document.body.classList.toggle("locked", !me);
}

function itemHtml(it) {
  const mine = it.claims.includes(me);
  const cls = it.own ? "" : (mine ? "mine" : (it.claims.length ? "" : "none"));
  const claims = it.own ? "" : `<div class="claims">` + PEOPLE.map(p =>
    `<button data-claim="${p}" class="${it.claims.includes(p) ? "on" : ""} ${p === me ? "me" : ""}">${p}</button>`).join("") + `</div>` +
    (it.claims.length ? "" : `<div class="nobody">Nobody's got this yet</div>`);
  const notes = it.notes.length ? `<div class="notes">` + it.notes.map(n => `<div class="note"><b>${esc(n.who)}:</b> ${esc(n.text)}</div>`).join("") + `</div>` : "";
  return `<div class="item ${cls} ${openId === it.id ? "open" : ""}" data-id="${it.id}">
    <div class="item-top"><button class="name">${esc(it.name)}</button></div>
    ${claims}${notes}
    <div class="note-row" style="margin-top:8px"><input placeholder="Add a note (e.g. I've got two of these)" data-note><button data-addnote>Add note</button></div>
    <div class="more">
      <div class="small-actions">
        <button data-flip>${it.own ? "Make it shared gear" : "Make it everybody-brings-their-own"}</button>
        <button data-remove class="danger">Remove</button>
      </div>
    </div>
  </div>`;
}

function groupHtml(items) {
  if (!items.length) return `<div class="item">Nothing here yet — add something above.</div>`;
  const cats = CATS.concat(items.map(i => i.category).filter(c => !CATS.includes(c)));
  return cats.map(c => {
    const list = items.filter(i => i.category === c);
    if (!list.length) return "";
    const unclaimed = list.filter(i => !i.own && !i.claims.length).length;
    const tag = list[0].own ? `${list.length} items` : (unclaimed ? `${unclaimed} still need someone` : "all covered");
    return `<div class="cat ${closedCats[c] ? "closed" : ""}"><button data-cat="${esc(c)}">${esc(c)} <span>${tag} ${closedCats[c] ? "▸" : "▾"}</span></button></div>
      <div class="items">${list.map(itemHtml).join("")}</div>`;
  }).join("");
}

function render() {
  renderWho();
  const shared = data.items.filter(i => !i.own);
  const own = data.items.filter(i => i.own);
  document.getElementById("sharedList").innerHTML = groupHtml(shared);
  document.getElementById("ownList").innerHTML = groupHtml(own);
  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { closedCats[b.dataset.cat] = !closedCats[b.dataset.cat]; render(); });

  document.querySelectorAll(".item[data-id]").forEach(el => {
    const id = el.dataset.id;
    const row = () => `${DB_URL}?id=eq.${id}`;
    el.querySelector(".name").onclick = () => { openId = openId === id ? null : id; render(); };

    el.querySelectorAll("[data-claim]").forEach(b => b.onclick = () => {
      const p = b.dataset.claim;
      const cur = data.items.find(i => i.id === id); if (!cur) return;
      const claims = cur.claims.includes(p) ? cur.claims.filter(x => x !== p) : cur.claims.concat(p);
      change(d => { cur.claims = claims; }, () => save("PATCH", row(), { claims }));
    });

    const noteInp = el.querySelector("[data-note]");
    if (noteInp) noteInp.onfocus = () => setTimeout(() => noteInp.scrollIntoView({ block: "center" }), 250);
    el.querySelector("[data-addnote]").onclick = () => {
      const text = noteInp.value.trim(); if (!text) return;
      const cur = data.items.find(i => i.id === id); if (!cur) return;
      const notes = cur.notes.concat({ who: me, text });
      change(d => { cur.notes = notes; }, () => save("PATCH", row(), { notes }));
    };

    el.querySelector("[data-flip]").onclick = () => {
      const cur = data.items.find(i => i.id === id); if (!cur) return;
      const own = !cur.own;
      change(d => { cur.own = own; }, () => save("PATCH", row(), { own }));
    };
    el.querySelector("[data-remove]").onclick = () => {
      if (!confirm("Remove this item for everyone?")) return;
      change(d => { d.items = d.items.filter(i => i.id !== id); }, () => save("DELETE", row()));
    };
  });
}

document.getElementById("addBtn").onclick = () => {
  const inp = document.getElementById("newName"); const name = inp.value.trim(); if (!name) return;
  const own = document.getElementById("newOwn").checked;
  const category = document.getElementById("newCat").value;
  inp.value = ""; document.getElementById("newOwn").checked = false;
  closedCats[category] = false;
  change(d => { d.items.push({ id: "tmp" + Date.now(), name, own, category, claims: [], notes: [] }); },
         () => save("POST", DB_URL, { name, own, category }));
};
document.getElementById("newName").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("addBtn").click(); });

document.getElementById("newCat").innerHTML = CATS.map(c => `<option>${esc(c)}</option>`).join("");
(async function start() {
  loadMe();
  try { await load(); setStatus(me ? "Up to date" : "Pick your name to start"); }
  catch (e) { setStatus("Couldn't reach the list — check your signal and reload"); }
  render();
  setInterval(async () => {
    const typing = document.activeElement && document.activeElement.tagName === "INPUT";
    if (!openId && !typing) { try { await load(); render(); } catch (e) {} }
  }, 8000);
})();
</script>
</body>
</html>
